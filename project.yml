name: CamerasDeCasa
options:
  bundleIdPrefix: com.lancameras
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR

# O núcleo (protocolos, vídeo, áudio) e a camada de sessão vêm do repositório do Mac,
# clonado ao lado deste: os dois apps usam exatamente o mesmo código.
packages:
  CamerasDeCasa:
    path: ../lan-cameras-mac

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Fica vazio no repositório: o script de instalação passa o time de quem compila.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  CamerasiOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
    dependencies:
      - package: CamerasDeCasa
        product: CamerasCore
      - package: CamerasDeCasa
        product: CamerasSessao
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Câmeras de Casa
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: "O app fala direto com as câmeras pelo Wi-Fi da sua casa: precisa da rede local para achá-las e mostrar o vídeo."
        NSMicrophoneUsageDescription: "Para você falar pelo alto-falante da câmera enquanto segura o botão Falar."
        NSPhotoLibraryAddUsageDescription: "Para guardar no app Fotos as fotos que você tira das câmeras e os vídeos que você salva das gravações."
        UIRequiresPersistentWiFi: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: FundoDaAbertura
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lancameras.ios
        PRODUCT_NAME: CamerasiOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"

  CamerasiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CamerasiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lancameras.ios.testes

  # De ponta a ponta com câmeras de verdade: só rodam com CAMERAS_REAIS=1 (veja o arquivo).
  CamerasiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: CamerasiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lancameras.ios.testes-de-interface

# Os alvos do iPhone se chamam CamerasiOS: o pacote do Mac já tem um executável chamado
# CamerasDeCasa, e o Xcode confundia os dois ao procurar o app nos testes de interface.
schemes:
  CamerasiOS:
    build:
      targets:
        CamerasiOS: all
        CamerasiOSTests: [test]
        CamerasiOSUITests: [test]
    test:
      targets:
        - CamerasiOSTests
        - CamerasiOSUITests
    run:
      config: Debug
